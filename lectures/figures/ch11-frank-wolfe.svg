<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#3d352f"/>
    </marker>
    <marker id="arr-blue" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#7b97ad"/>
    </marker>
    <marker id="arr-rose" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#b56b6b"/>
    </marker>
  </defs>

  <text x="350" y="24" text-anchor="middle" font-size="16" font-weight="bold">Projected Gradient Descent vs Frank-Wolfe</text>

  <!-- === Left: PGD === -->
  <text x="175" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#7b97ad">Projected Gradient Descent</text>

  <!-- Feasible set C -->
  <ellipse cx="175" cy="190" rx="110" ry="90" fill="#7a9a7e" fill-opacity="0.08" stroke="#7a9a7e" stroke-width="1.8"/>
  <text x="175" y="270" text-anchor="middle" font-size="11" fill="#7a9a7e">𝒞</text>

  <!-- Current point -->
  <circle cx="150" cy="170" r="4" fill="#7b97ad"/>
  <text x="135" y="165" font-size="10" fill="#7b97ad">𝑥&#x1D4F;</text>

  <!-- Gradient step (leaves C) -->
  <line x1="150" y1="170" x2="80" y2="100" stroke="#7b97ad" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <circle cx="80" cy="100" r="3" fill="#b56b6b"/>
  <text x="65" y="92" font-size="9" fill="#b56b6b">outside!</text>

  <!-- Projection back -->
  <line x1="80" y1="100" x2="105" y2="125" stroke="#b56b6b" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#arr-rose)"/>
  <circle cx="105" cy="125" r="4" fill="#7a9a7e"/>
  <text x="90" y="145" font-size="10" fill="#7a9a7e">Proj_𝒞</text>

  <!-- Labels -->
  <text x="55" y="140" font-size="10" fill="#7b97ad">gradient step</text>
  <text x="110" y="155" font-size="10" fill="#b56b6b">project</text>

  <!-- Divider -->
  <line x1="350" y1="45" x2="350" y2="300" stroke="#968a80" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- === Right: Frank-Wolfe === -->
  <text x="525" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8995e">Frank-Wolfe (Conditional Gradient)</text>

  <!-- Feasible set C (polygon to show vertices) -->
  <polygon points="420,250 400,150 460,90 560,100 600,200 550,260" fill="#7a9a7e" fill-opacity="0.08" stroke="#7a9a7e" stroke-width="1.8"/>
  <text x="500" y="270" text-anchor="middle" font-size="11" fill="#7a9a7e">𝒞</text>

  <!-- Current point -->
  <circle cx="490" cy="180" r="4" fill="#b8995e"/>
  <text x="500" y="195" font-size="10" fill="#b8995e">𝑥&#x1D4F;</text>

  <!-- Linearize: find vertex y that minimizes <∇f, y> -->
  <circle cx="460" cy="90" r="5" fill="#b56b6b"/>
  <text x="440" y="82" font-size="10" fill="#b56b6b">𝑦&#x1D4F; (vertex)</text>

  <!-- Arrow from x to y (convex combination step) -->
  <line x1="490" y1="180" x2="470" y2="120" stroke="#b8995e" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="478" cy="144" r="4" fill="#7a9a7e"/>
  <text x="500" y="140" font-size="10" fill="#7a9a7e">𝑥&#x1D4F;⁺¹</text>

  <!-- Labels -->
  <text x="540" y="130" font-size="10" fill="#b8995e">convex combo</text>
  <text x="540" y="145" font-size="10" fill="#b8995e">step towards 𝑦&#x1D4F;</text>

  <!-- Bottom annotations -->
  <text x="175" y="300" text-anchor="middle" font-size="11" fill="#968a80">Requires: projection onto 𝒞</text>
  <text x="525" y="300" text-anchor="middle" font-size="11" fill="#968a80">Requires: linear min over 𝒞</text>
</svg>
