<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 380" width="750" height="380">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#3d352f"/>
    </marker>
  </defs>

  <!-- Feasible region (shaded strip) -->
  <rect x="505" y="38" width="195" height="284" fill="#7a9a7e" fill-opacity="0.10" rx="5"/>
  <rect x="505" y="38" width="195" height="284" fill="none" stroke="#7a9a7e" stroke-width="1.5" stroke-dasharray="6 4" rx="5"/>

  <!-- Axes -->
  <line x1="65" y1="325" x2="710" y2="325" stroke="#3d352f" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="65" y1="325" x2="65" y2="25" stroke="#3d352f" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Axis labels -->
  <text x="718" y="330" font-size="16" fill="#3d352f" font-style="italic">&#x1D465;</text>
  <text x="40" y="22" font-size="16" fill="#3d352f" font-style="italic">&#x1D453;(&#x1D465;)</text>

  <!-- Function curve -->
  <path d="M 80,100 C 120,90 155,268 190,255 C 225,245 265,100 310,112 C 355,125 430,260 475,285 C 510,292 558,172 590,172 C 622,172 660,105 685,75"
        fill="none" stroke="#7b97ad" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dashed drop lines from points to x-axis -->
  <line x1="190" y1="258" x2="190" y2="325" stroke="#b56b6b" stroke-width="0.7" stroke-dasharray="3 3"/>
  <line x1="310" y1="115" x2="310" y2="325" stroke="#907ea0" stroke-width="0.7" stroke-dasharray="3 3"/>
  <line x1="475" y1="288" x2="475" y2="325" stroke="#b8995e" stroke-width="0.7" stroke-dasharray="3 3"/>
  <line x1="590" y1="175" x2="590" y2="325" stroke="#7a9a7e" stroke-width="0.7" stroke-dasharray="3 3"/>

  <!-- Local minimum -->
  <circle cx="190" cy="255" r="5" fill="#b56b6b"/>
  <text x="190" y="280" font-size="12.5" fill="#b56b6b" text-anchor="middle" font-weight="600">Local Min</text>

  <!-- Local maximum -->
  <circle cx="310" cy="112" r="5" fill="#907ea0"/>
  <text x="310" y="97" font-size="12.5" fill="#907ea0" text-anchor="middle" font-weight="600">Local Max</text>

  <!-- Global minimum (circled dot) -->
  <circle cx="475" cy="285" r="7" fill="none" stroke="#b8995e" stroke-width="2.2"/>
  <circle cx="475" cy="285" r="2.5" fill="#b8995e"/>
  <text x="475" y="310" font-size="13" fill="#b8995e" text-anchor="middle" font-weight="700">Global Min</text>

  <!-- Constrained optimum -->
  <circle cx="590" cy="172" r="5" fill="#7a9a7e"/>
  <text x="590" y="157" font-size="12.5" fill="#7a9a7e" text-anchor="middle" font-weight="600">Constrained Opt.</text>

  <!-- Feasible region label -->
  <text x="602" y="350" font-size="13" fill="#7a9a7e" text-anchor="middle" font-style="italic">Feasible Region</text>
</svg>
