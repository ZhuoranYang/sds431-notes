<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#3d352f"/>
    </marker>
  </defs>

  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="bold">Simplex Method: Vertex Traversal</text>

  <!-- Feasible polytope -->
  <polygon points="90,320 70,150 200,60 380,55 480,160 440,300 280,340" fill="#7a9a7e" fill-opacity="0.1" stroke="#7a9a7e" stroke-width="2"/>

  <!-- Vertices as circles -->
  <circle cx="90" cy="320" r="4" fill="#968a80"/>
  <circle cx="70" cy="150" r="4" fill="#968a80"/>
  <circle cx="200" cy="60" r="4" fill="#968a80"/>
  <circle cx="380" cy="55" r="4" fill="#968a80"/>
  <circle cx="480" cy="160" r="4" fill="#968a80"/>
  <circle cx="440" cy="300" r="4" fill="#968a80"/>
  <circle cx="280" cy="340" r="4" fill="#968a80"/>

  <!-- Simplex path (edges of polytope) -->
  <polyline points="440,300 480,160 380,55 200,60" fill="none" stroke="#7b97ad" stroke-width="3"/>

  <!-- Step arrows along the path -->
  <circle cx="440" cy="300" r="6" fill="#7b97ad"/>
  <text x="450" y="316" font-size="12" fill="#7b97ad">start</text>

  <circle cx="480" cy="160" r="6" fill="#7b97ad"/>
  <text x="492" y="165" font-size="11" fill="#7b97ad">pivot 1</text>

  <circle cx="380" cy="55" r="6" fill="#7b97ad"/>
  <text x="392" y="50" font-size="11" fill="#7b97ad">pivot 2</text>

  <!-- Optimal vertex -->
  <circle cx="200" cy="60" r="8" fill="#b56b6b"/>
  <text x="200" y="45" text-anchor="middle" font-size="13" fill="#b56b6b" font-weight="bold">𝑥* (optimal)</text>

  <!-- Direction arrows on edges -->
  <line x1="460" y1="232" x2="475" y2="185" stroke="#b8995e" stroke-width="0" marker-end="url(#arr)"/>
  <line x1="432" y1="108" x2="405" y2="72" stroke="#b8995e" stroke-width="0" marker-end="url(#arr)"/>
  <line x1="295" y1="58" x2="230" y2="60" stroke="#b8995e" stroke-width="0" marker-end="url(#arr)"/>

  <!-- Step labels with objective improvement -->
  <text x="505" y="240" font-size="11" fill="#b8995e">𝑐&#x1D40;𝑥 improves</text>
  <text x="505" y="256" font-size="11" fill="#b8995e">at each pivot</text>

  <!-- Objective direction -->
  <line x1="140" y1="260" x2="120" y2="170" stroke="#968a80" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="100" y="280" font-size="11" fill="#968a80" font-style="italic">optimize 𝑐</text>

  <!-- Label for feasible region -->
  <text x="280" y="230" text-anchor="middle" font-size="12" fill="#7a9a7e">feasible polytope</text>
</svg>
