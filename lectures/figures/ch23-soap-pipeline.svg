<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#968a80"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="bold">SOAP Pipeline</text>

  <!-- Step 1: Shampoo eigenbases -->
  <rect x="15" y="50" width="140" height="65" rx="8" fill="#7b97ad" fill-opacity="0.12" stroke="#7b97ad" stroke-width="1.8"/>
  <text x="85" y="72" text-anchor="middle" font-size="11" fill="#7b97ad" font-weight="bold">1. Eigenbases</text>
  <text x="85" y="88" text-anchor="middle" font-size="10" fill="#7b97ad">𝑳 = 𝑄_𝐿 𝛬_𝐿 𝑄_𝐿&#x1D40;</text>
  <text x="85" y="102" text-anchor="middle" font-size="10" fill="#7b97ad">𝑹 = 𝑄_𝑅 𝛬_𝑅 𝑄_𝑅&#x1D40;</text>

  <line x1="155" y1="82" x2="180" y2="82" stroke="#968a80" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: Rotate gradient -->
  <rect x="185" y="50" width="140" height="65" rx="8" fill="#7a9a7e" fill-opacity="0.12" stroke="#7a9a7e" stroke-width="1.8"/>
  <text x="255" y="72" text-anchor="middle" font-size="11" fill="#7a9a7e" font-weight="bold">2. Rotate 𝐺</text>
  <text x="255" y="90" text-anchor="middle" font-size="10" fill="#7a9a7e">𝐺&#x0303; = 𝑄_𝐿&#x1D40; 𝐺 𝑄_𝑅</text>
  <text x="255" y="104" text-anchor="middle" font-size="10" fill="#968a80">diagonalizing basis</text>

  <line x1="325" y1="82" x2="350" y2="82" stroke="#968a80" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: Adam in rotated basis -->
  <rect x="355" y="50" width="155" height="65" rx="8" fill="#b8995e" fill-opacity="0.12" stroke="#b8995e" stroke-width="1.8"/>
  <text x="432" y="72" text-anchor="middle" font-size="11" fill="#b8995e" font-weight="bold">3. Adam on 𝐺&#x0303;</text>
  <text x="432" y="90" text-anchor="middle" font-size="10" fill="#b8995e">𝑚&#x0303;, 𝑣&#x0303; moments of 𝐺&#x0303;</text>
  <text x="432" y="104" text-anchor="middle" font-size="10" fill="#968a80">adaptive per-entry</text>

  <line x1="510" y1="82" x2="535" y2="82" stroke="#968a80" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4: Rotate back -->
  <rect x="540" y="50" width="165" height="65" rx="8" fill="#b56b6b" fill-opacity="0.12" stroke="#b56b6b" stroke-width="1.8"/>
  <text x="622" y="72" text-anchor="middle" font-size="11" fill="#b56b6b" font-weight="bold">4. Rotate back</text>
  <text x="622" y="90" text-anchor="middle" font-size="10" fill="#b56b6b">Δ𝑊 = 𝑄_𝐿 (Adam step) 𝑄_𝑅&#x1D40;</text>
  <text x="622" y="104" text-anchor="middle" font-size="10" fill="#968a80">back to original basis</text>

  <!-- Bottom summary -->
  <rect x="100" y="145" width="520" height="50" rx="8" fill="#f9f6f0" stroke="#968a80" stroke-width="1"/>
  <text x="360" y="168" text-anchor="middle" font-size="12" fill="#3d352f" font-weight="bold">SOAP = Shampoo eigenbases + Adam in rotated coordinates</text>
  <text x="360" y="186" text-anchor="middle" font-size="11" fill="#968a80">Combines Shampoo's second-order structure with Adam's adaptive moments</text>
</svg>
