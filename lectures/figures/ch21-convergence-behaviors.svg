<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#3d352f"/>
    </marker>
  </defs>

  <!-- (i) Convergence -->
  <g transform="translate(10,20)">
    <text x="105" y="12" text-anchor="middle" font-size="13" font-weight="bold">(i) Convergence</text>
    <line x1="25" y1="230" x2="195" y2="230" stroke="#3d352f" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="25" y1="230" x2="25" y2="30" stroke="#3d352f" stroke-width="1" marker-end="url(#arr)"/>
    <text x="195" y="248" font-size="10" font-style="italic">𝑥</text>
    <text x="15" y="38" font-size="10" font-style="italic">𝑓</text>
    <!-- Curve with root -->
    <path d="M 35,180 Q 80,260 110,230 Q 140,200 185,100" fill="none" stroke="#7a9a7e" stroke-width="2"/>
    <!-- Iterates converging -->
    <circle cx="160" cy="140" r="3" fill="#7b97ad"/><text x="160" y="133" text-anchor="middle" font-size="9" fill="#7b97ad">𝑥₀</text>
    <circle cx="130" cy="215" r="3" fill="#7b97ad"/><text x="130" y="210" text-anchor="end" font-size="9" fill="#7b97ad">𝑥₁</text>
    <circle cx="115" cy="232" r="3" fill="#7b97ad"/><text x="115" y="252" text-anchor="middle" font-size="9" fill="#7b97ad">𝑥₂</text>
    <!-- Root -->
    <circle cx="110" cy="230" r="4" fill="#7a9a7e"/>
    <text x="108" y="270" text-anchor="middle" font-size="10" fill="#7a9a7e" font-style="italic">𝑥*</text>
  </g>

  <!-- (ii) Cycling -->
  <g transform="translate(240,20)">
    <text x="105" y="12" text-anchor="middle" font-size="13" font-weight="bold">(ii) Cycling</text>
    <line x1="25" y1="230" x2="195" y2="230" stroke="#3d352f" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="25" y1="230" x2="25" y2="30" stroke="#3d352f" stroke-width="1" marker-end="url(#arr)"/>
    <text x="195" y="248" font-size="10" font-style="italic">𝑥</text>
    <text x="15" y="38" font-size="10" font-style="italic">𝑓</text>
    <!-- S-shaped curve -->
    <path d="M 40,110 Q 80,280 110,230 Q 140,180 185,310" fill="none" stroke="#b8995e" stroke-width="2"/>
    <!-- Two cycling points -->
    <circle cx="65" cy="175" r="3" fill="#b56b6b"/>
    <text x="55" y="170" font-size="9" fill="#b56b6b">𝑥₀</text>
    <circle cx="155" cy="265" r="3" fill="#b56b6b"/>
    <text x="165" y="262" font-size="9" fill="#b56b6b">𝑥₁</text>
    <!-- Cycling arrow -->
    <path d="M 68,178 Q 110,120 152,262" fill="none" stroke="#b56b6b" stroke-width="1" stroke-dasharray="3 2"/>
    <path d="M 152,262 Q 110,300 68,178" fill="none" stroke="#b56b6b" stroke-width="1" stroke-dasharray="3 2"/>
  </g>

  <!-- (iii) Divergence -->
  <g transform="translate(470,20)">
    <text x="105" y="12" text-anchor="middle" font-size="13" font-weight="bold">(iii) Divergence</text>
    <line x1="25" y1="230" x2="195" y2="230" stroke="#3d352f" stroke-width="1" marker-end="url(#arr)"/>
    <line x1="25" y1="230" x2="25" y2="30" stroke="#3d352f" stroke-width="1" marker-end="url(#arr)"/>
    <text x="195" y="248" font-size="10" font-style="italic">𝑥</text>
    <text x="15" y="38" font-size="10" font-style="italic">𝑓</text>
    <!-- Flat curve with shallow tangent -->
    <path d="M 40,200 Q 100,240 130,225 Q 160,210 185,195" fill="none" stroke="#b56b6b" stroke-width="2"/>
    <!-- Iterates diverging -->
    <circle cx="90" cy="228" r="3" fill="#907ea0"/>
    <text x="90" y="222" text-anchor="middle" font-size="9" fill="#907ea0">𝑥₀</text>
    <circle cx="145" cy="218" r="3" fill="#907ea0"/>
    <text x="145" y="212" text-anchor="middle" font-size="9" fill="#907ea0">𝑥₁</text>
    <!-- Arrow showing divergence -->
    <line x1="150" y1="220" x2="185" y2="215" stroke="#907ea0" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="160" y="260" font-size="10" fill="#907ea0">→ ∞</text>
  </g>
</svg>
