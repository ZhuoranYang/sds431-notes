<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#3d352f"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="660" height="340" rx="18" fill="#f9f6f0" stroke="#968a80" stroke-width="1"/>

  <!-- Title -->
  <text x="340" y="42" text-anchor="middle" font-size="16" font-weight="bold">The Condition Number Problem</text>

  <!-- === Left panel: Gradient Descent zigzags === -->
  <text x="190" y="72" text-anchor="middle" font-size="14" fill="#7b97ad" font-weight="bold">GD zigzags</text>

  <!-- Elliptic contours (ill-conditioned) -->
  <ellipse cx="190" cy="200" rx="150" ry="40" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="190" cy="200" rx="120" ry="32" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.35"/>
  <ellipse cx="190" cy="200" rx="90" ry="24" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="190" cy="200" rx="60" ry="16" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.45"/>
  <ellipse cx="190" cy="200" rx="30" ry="8" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.5"/>

  <!-- Optimum point -->
  <circle cx="190" cy="200" r="4" fill="#7a9a7e"/>
  <text x="190" y="218" text-anchor="middle" font-size="13" fill="#7a9a7e" font-style="italic">𝑥*</text>

  <!-- GD zigzag path (blue dashed) -->
  <polyline points="320,170 250,225 280,180 230,215 255,190 215,208 230,198 205,203"
    fill="none" stroke="#7b97ad" stroke-width="1.8" stroke-dasharray="4 3"/>
  <!-- Arrowhead at end of GD path -->
  <circle cx="205" cy="203" r="2.5" fill="#7b97ad"/>
  <!-- Start point -->
  <circle cx="320" cy="170" r="3" fill="#7b97ad"/>

  <!-- === Right panel: Newton's method direct path === -->
  <text x="510" y="72" text-anchor="middle" font-size="14" fill="#b56b6b" font-weight="bold">Newton's method: direct path</text>

  <!-- Elliptic contours -->
  <ellipse cx="510" cy="200" rx="150" ry="40" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="510" cy="200" rx="120" ry="32" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.35"/>
  <ellipse cx="510" cy="200" rx="90" ry="24" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="510" cy="200" rx="60" ry="16" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.45"/>
  <ellipse cx="510" cy="200" rx="30" ry="8" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.5"/>

  <!-- Optimum point -->
  <circle cx="510" cy="200" r="4" fill="#7a9a7e"/>
  <text x="510" y="218" text-anchor="middle" font-size="13" fill="#7a9a7e" font-style="italic">𝑥*</text>

  <!-- Newton direct path (rose, solid) -->
  <line x1="640" y1="170" x2="515" y2="199" stroke="#b56b6b" stroke-width="2.2"/>
  <circle cx="640" cy="170" r="3" fill="#b56b6b"/>
  <circle cx="515" cy="199" r="2.5" fill="#b56b6b"/>

  <!-- Axis labels -->
  <text x="190" y="260" text-anchor="middle" font-size="12" fill="#968a80" font-style="italic">𝑥</text>
  <text x="50" y="200" text-anchor="middle" font-size="12" fill="#968a80" font-style="italic" transform="rotate(-90,50,200)">𝑥</text>
  <text x="198" y="264" text-anchor="start" font-size="9" fill="#968a80">1</text>
  <text x="43" y="193" text-anchor="start" font-size="9" fill="#968a80">2</text>

  <text x="510" y="260" text-anchor="middle" font-size="12" fill="#968a80" font-style="italic">𝑥</text>
  <text x="370" y="200" text-anchor="middle" font-size="12" fill="#968a80" font-style="italic" transform="rotate(-90,370,200)">𝑥</text>
  <text x="518" y="264" text-anchor="start" font-size="9" fill="#968a80">1</text>
  <text x="363" y="193" text-anchor="start" font-size="9" fill="#968a80">2</text>

  <!-- Legend -->
  <line x1="100" y1="310" x2="130" y2="310" stroke="#7b97ad" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="138" y="314" font-size="12" fill="#7b97ad">GD zigzags (𝜅 large)</text>

  <line x1="380" y1="310" x2="410" y2="310" stroke="#b56b6b" stroke-width="2.2"/>
  <text x="418" y="314" font-size="12" fill="#b56b6b">Newton: direct path</text>
</svg>
