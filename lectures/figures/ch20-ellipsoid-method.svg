<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#3d352f"/>
    </marker>
  </defs>

  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold">The Ellipsoid Method</text>

  <!-- Feasible region P (small polygon inside) -->
  <polygon points="310,200 330,175 360,180 365,210 340,225" fill="#7a9a7e" fill-opacity="0.25" stroke="#7a9a7e" stroke-width="1.5"/>
  <text x="338" y="205" text-anchor="middle" font-size="11" fill="#7a9a7e" font-weight="bold">𝑃</text>

  <!-- Ellipsoid 0 (largest) -->
  <ellipse cx="340" cy="200" rx="250" ry="150" fill="none" stroke="#7b97ad" stroke-width="1.8" opacity="0.4"/>
  <text x="570" y="115" font-size="13" fill="#7b97ad">E₀</text>

  <!-- Separating hyperplane 0 (vertical dashed) -->
  <line x1="340" y1="40" x2="340" y2="360" stroke="#b8995e" stroke-width="1" stroke-dasharray="5 3" opacity="0.5"/>

  <!-- Ellipsoid 1 (medium, shifted right) -->
  <ellipse cx="380" cy="200" rx="170" ry="120" fill="none" stroke="#7b97ad" stroke-width="2" opacity="0.6" transform="rotate(-10,380,200)"/>
  <text x="530" y="130" font-size="13" fill="#7b97ad">E₁</text>

  <!-- Separating hyperplane 1 -->
  <line x1="370" y1="65" x2="350" y2="340" stroke="#b8995e" stroke-width="1" stroke-dasharray="5 3" opacity="0.5"/>

  <!-- Ellipsoid 2 (smallest, centered on P) -->
  <ellipse cx="355" cy="195" rx="100" ry="70" fill="none" stroke="#b56b6b" stroke-width="2.5" transform="rotate(-5,355,195)"/>
  <text x="440" y="155" font-size="13" fill="#b56b6b" font-weight="bold">E₂</text>

  <!-- Volume shrinkage annotation -->
  <text x="340" y="355" text-anchor="middle" font-size="12" fill="#968a80">vol(E_{𝑘+1}) / vol(E_𝑘) &lt;= 𝑒^{-1/(2𝑛+2)}</text>

  <!-- Separating hyperplane label -->
  <text x="100" y="55" font-size="12" fill="#b8995e">separating hyperplanes</text>
  <line x1="215" y1="52" x2="335" y2="52" stroke="#b8995e" stroke-width="0.8" stroke-dasharray="3 2"/>

  <!-- Arrow showing shrinkage -->
  <line x1="570" y1="115" x2="455" y2="150" stroke="#968a80" stroke-width="0.8" marker-end="url(#arr)" stroke-dasharray="3 2" opacity="0"/>

  <!-- Progression label -->
  <text x="580" y="200" font-size="12" fill="#968a80">each step:</text>
  <text x="580" y="218" font-size="11" fill="#968a80">cut + refit</text>
</svg>
