<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#7b97ad"/>
    </marker>
    <marker id="arr-rose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#b56b6b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold">Uniform vs Adaptive Stepsize</text>

  <!-- === Left: Uniform stepsize === -->
  <text x="170" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#7b97ad">Uniform stepsize</text>

  <!-- Elliptic contours -->
  <ellipse cx="170" cy="170" rx="130" ry="45" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.35"/>
  <ellipse cx="170" cy="170" rx="95" ry="33" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="170" cy="170" rx="60" ry="21" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.45"/>
  <ellipse cx="170" cy="170" rx="25" ry="9" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.5"/>

  <!-- Uniform arrows (all same length) -->
  <line x1="280" y1="140" x2="240" y2="155" stroke="#7b97ad" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="240" y1="155" x2="220" y2="195" stroke="#7b97ad" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="220" y1="195" x2="195" y2="168" stroke="#7b97ad" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="195" y1="168" x2="182" y2="178" stroke="#7b97ad" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <circle cx="170" cy="170" r="3.5" fill="#7a9a7e"/>

  <!-- Caption -->
  <text x="170" y="250" text-anchor="middle" font-size="12" fill="#7b97ad">Same step in all directions</text>

  <!-- === Right: Adaptive stepsize === -->
  <text x="510" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#b56b6b">Adaptive stepsize</text>

  <ellipse cx="510" cy="170" rx="130" ry="45" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.35"/>
  <ellipse cx="510" cy="170" rx="95" ry="33" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="510" cy="170" rx="60" ry="21" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.45"/>
  <ellipse cx="510" cy="170" rx="25" ry="9" fill="none" stroke="#968a80" stroke-width="0.8" opacity="0.5"/>

  <!-- Adaptive arrows (longer in flat direction, shorter in steep) -->
  <line x1="620" y1="155" x2="560" y2="165" stroke="#b56b6b" stroke-width="1.8" marker-end="url(#arr-rose)"/>
  <line x1="560" y1="165" x2="530" y2="172" stroke="#b56b6b" stroke-width="1.8" marker-end="url(#arr-rose)"/>
  <line x1="530" y1="172" x2="515" y2="170" stroke="#b56b6b" stroke-width="1.8" marker-end="url(#arr-rose)"/>

  <circle cx="510" cy="170" r="3.5" fill="#7a9a7e"/>

  <!-- Caption -->
  <text x="510" y="250" text-anchor="middle" font-size="12" fill="#b56b6b">Adjusts to local curvature</text>
</svg>
