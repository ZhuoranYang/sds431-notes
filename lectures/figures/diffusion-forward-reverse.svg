<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr-fwd" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#7b97ad"/>
    </marker>
    <marker id="arr-rev" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#b56b6b"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold">Diffusion Models: Forward and Reverse Processes</text>

  <!-- Time axis -->
  <line x1="60" y1="310" x2="660" y2="310" stroke="#968a80" stroke-width="1"/>
  <text x="60" y="335" text-anchor="middle" font-size="11" fill="#968a80">𝑡 = 0</text>
  <text x="240" y="335" text-anchor="middle" font-size="11" fill="#968a80">𝑡 = 𝑇/3</text>
  <text x="420" y="335" text-anchor="middle" font-size="11" fill="#968a80">𝑡 = 2𝑇/3</text>
  <text x="660" y="335" text-anchor="middle" font-size="11" fill="#968a80">𝑡 = 𝑇</text>

  <!-- Data distribution (structured, left) -->
  <ellipse cx="60" cy="160" rx="35" ry="50" fill="#7a9a7e" fill-opacity="0.15" stroke="#7a9a7e" stroke-width="1.5"/>
  <text x="60" y="155" text-anchor="middle" font-size="11" fill="#7a9a7e">data</text>
  <text x="60" y="170" text-anchor="middle" font-size="11" fill="#7a9a7e">𝑞₀(𝑥)</text>

  <!-- Intermediate 1 (slightly noisy) -->
  <ellipse cx="240" cy="160" rx="45" ry="55" fill="#7b97ad" fill-opacity="0.1" stroke="#7b97ad" stroke-width="1.2"/>
  <text x="240" y="155" text-anchor="middle" font-size="10" fill="#7b97ad">slightly</text>
  <text x="240" y="170" text-anchor="middle" font-size="10" fill="#7b97ad">noisy</text>

  <!-- Intermediate 2 (more noisy) -->
  <ellipse cx="420" cy="160" rx="55" ry="58" fill="#b8995e" fill-opacity="0.08" stroke="#b8995e" stroke-width="1.2"/>
  <text x="420" y="155" text-anchor="middle" font-size="10" fill="#b8995e">more</text>
  <text x="420" y="170" text-anchor="middle" font-size="10" fill="#b8995e">noisy</text>

  <!-- Pure noise (right) -->
  <circle cx="660" cy="160" r="60" fill="#968a80" fill-opacity="0.08" stroke="#968a80" stroke-width="1.5"/>
  <text x="660" y="155" text-anchor="middle" font-size="11" fill="#968a80">noise</text>
  <text x="660" y="170" text-anchor="middle" font-size="11" fill="#968a80">𝒩(0, 𝐼)</text>

  <!-- Forward arrows (top) -->
  <line x1="100" y1="100" x2="195" y2="100" stroke="#7b97ad" stroke-width="2" marker-end="url(#arr-fwd)"/>
  <line x1="285" y1="100" x2="375" y2="100" stroke="#7b97ad" stroke-width="2" marker-end="url(#arr-fwd)"/>
  <line x1="475" y1="100" x2="600" y2="100" stroke="#7b97ad" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <text x="360" y="70" text-anchor="middle" font-size="13" fill="#7b97ad" font-weight="bold">Forward process (add noise)</text>
  <text x="360" y="88" text-anchor="middle" font-size="11" fill="#7b97ad">𝑞(𝑥_𝑡 | 𝑥_{𝑡-1}) = 𝒩(√(1-𝛽_𝑡) 𝑥_{𝑡-1}, 𝛽_𝑡 𝐼)</text>

  <!-- Reverse arrows (bottom) -->
  <line x1="600" y1="230" x2="475" y2="230" stroke="#b56b6b" stroke-width="2" marker-end="url(#arr-rev)"/>
  <line x1="375" y1="230" x2="285" y2="230" stroke="#b56b6b" stroke-width="2" marker-end="url(#arr-rev)"/>
  <line x1="195" y1="230" x2="100" y2="230" stroke="#b56b6b" stroke-width="2" marker-end="url(#arr-rev)"/>

  <text x="360" y="260" text-anchor="middle" font-size="13" fill="#b56b6b" font-weight="bold">Reverse process (learned denoising)</text>
  <text x="360" y="278" text-anchor="middle" font-size="11" fill="#b56b6b">𝑝_𝜃(𝑥_{𝑡-1} | 𝑥_𝑡) -- neural network predicts noise</text>
</svg>
