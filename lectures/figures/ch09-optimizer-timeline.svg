<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#968a80"/>
    </marker>
  </defs>

  <!-- Timeline axis -->
  <line x1="40" y1="100" x2="670" y2="100" stroke="#968a80" stroke-width="2" marker-end="url(#arr)"/>

  <!-- GD -->
  <circle cx="80" cy="100" r="5" fill="#7a9a7e"/>
  <text x="80" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a9a7e">GD</text>
  <text x="80" y="130" text-anchor="middle" font-size="10" fill="#968a80">vanilla</text>

  <!-- Momentum / Polyak -->
  <circle cx="180" cy="100" r="5" fill="#7b97ad"/>
  <text x="180" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b97ad">Momentum</text>
  <text x="180" y="130" text-anchor="middle" font-size="10" fill="#968a80">heavy ball</text>

  <!-- Nesterov -->
  <circle cx="280" cy="100" r="5" fill="#907ea0"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#907ea0">NAG</text>
  <text x="280" y="130" text-anchor="middle" font-size="10" fill="#968a80">Nesterov</text>

  <!-- Adagrad -->
  <circle cx="380" cy="100" r="5" fill="#b8995e"/>
  <text x="380" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8995e">AdaGrad</text>
  <text x="380" y="130" text-anchor="middle" font-size="10" fill="#968a80">adaptive lr</text>

  <!-- RMSProp -->
  <circle cx="470" cy="100" r="5" fill="#ad8480"/>
  <text x="470" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#ad8480">RMSProp</text>
  <text x="470" y="130" text-anchor="middle" font-size="10" fill="#968a80">exp. avg.</text>

  <!-- Adam -->
  <circle cx="560" cy="100" r="5" fill="#b56b6b"/>
  <text x="560" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#b56b6b">Adam</text>
  <text x="560" y="130" text-anchor="middle" font-size="10" fill="#968a80">mom + adapt</text>

  <!-- AdamW -->
  <circle cx="640" cy="100" r="5" fill="#b56b6b"/>
  <text x="640" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#b56b6b">AdamW</text>
  <text x="640" y="130" text-anchor="middle" font-size="10" fill="#968a80">decoupled WD</text>

  <text x="355" y="170" text-anchor="middle" font-size="14" font-weight="bold">Evolution of First-Order Optimizers</text>
</svg>
