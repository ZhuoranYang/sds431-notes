<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="500" height="360">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#3d352f"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="50" y1="300" x2="460" y2="300" stroke="#3d352f" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="250" y1="310" x2="250" y2="30" stroke="#3d352f" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="460" y="318" text-anchor="end" font-size="12" font-style="italic">𝑧</text>

  <!-- g(z) = |z| (V-shape, blue) -->
  <line x1="80" y1="80" x2="250" y2="250" stroke="#7b97ad" stroke-width="2"/>
  <line x1="250" y1="250" x2="420" y2="80" stroke="#7b97ad" stroke-width="2"/>
  <text x="415" y="75" font-size="13" fill="#7b97ad" font-style="italic">𝑔(𝑧) = |𝑧|</text>

  <!-- Quadratic penalty centered at x_k (dashed green) -->
  <path d="M 120,100 Q 250,330 380,100" fill="none" stroke="#7a9a7e" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="390" y="110" font-size="11" fill="#7a9a7e">(1/2𝜂)||𝑧 - 𝑥</text>
  <text x="487" y="114" font-size="8" fill="#7a9a7e">𝑘</text>
  <text x="493" y="110" font-size="11" fill="#7a9a7e">||</text>
  <text x="504" y="106" font-size="8" fill="#7a9a7e">2</text>

  <!-- Sum (solid terracotta) -->
  <path d="M 100,60 Q 200,290 290,180 Q 310,155 400,50" fill="none" stroke="#b56b6b" stroke-width="2"/>
  <text x="405" y="48" font-size="11" fill="#b56b6b">𝑔(𝑧) + quad penalty</text>

  <!-- x_k marker -->
  <line x1="310" y1="295" x2="310" y2="305" stroke="#7a9a7e" stroke-width="1.5"/>
  <text x="310" y="322" text-anchor="middle" font-size="12" fill="#7a9a7e" font-style="italic">𝑥</text>
  <text x="320" y="326" font-size="8" fill="#7a9a7e">𝑘</text>

  <!-- x_{k+1} marker (proximal output) -->
  <circle cx="275" cy="220" r="4" fill="#b56b6b"/>
  <line x1="275" y1="295" x2="275" y2="305" stroke="#b56b6b" stroke-width="1.5"/>
  <text x="275" y="322" text-anchor="middle" font-size="12" fill="#b56b6b" font-style="italic">𝑥</text>
  <text x="285" y="326" font-size="8" fill="#b56b6b">𝑘+1</text>

  <!-- Annotation arrow -->
  <line x1="275" y1="220" x2="275" y2="298" stroke="#b56b6b" stroke-width="0.8" stroke-dasharray="3 2"/>

  <text x="250" y="20" text-anchor="middle" font-size="14" font-weight="bold">Proximal Operator for 𝑔(𝑧) = |𝑧|</text>
</svg>
