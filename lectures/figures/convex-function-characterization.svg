<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 320" width="750" height="320">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#3d352f"/>
    </marker>
  </defs>

  <text x="375" y="24" text-anchor="middle" font-size="16" font-weight="bold">Three Characterizations of Convex Functions</text>

  <!-- === (a) First-order: tangent line below === -->
  <text x="125" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#7b97ad">(a) First-order</text>

  <!-- Axes -->
  <line x1="30" y1="240" x2="220" y2="240" stroke="#3d352f" stroke-width="0.8"/>
  <line x1="30" y1="240" x2="30" y2="75" stroke="#3d352f" stroke-width="0.8"/>

  <!-- Symmetric convex curve -->
  <path d="M 40,95 C 65,200 95,225 125,230 C 155,225 185,200 210,95" fill="none" stroke="#7b97ad" stroke-width="2"/>

  <!-- Tangent line at x₀ (left side of bowl, slope negative) -->
  <line x1="45" y1="155" x2="195" y2="210" stroke="#b8995e" stroke-width="1.2" stroke-dasharray="4 2"/>

  <!-- Point of tangency -->
  <circle cx="80" cy="175" r="3.5" fill="#7b97ad"/>
  <text x="65" y="190" font-size="10" fill="#7b97ad">𝑥₀</text>

  <!-- Label -->
  <text x="125" y="265" text-anchor="middle" font-size="11" fill="#968a80">𝑓(𝑦) >= 𝑓(𝑥) + ∇𝑓(𝑥)&#x1D40;(𝑦-𝑥)</text>
  <text x="125" y="280" text-anchor="middle" font-size="10" fill="#968a80">tangent always below</text>

  <!-- === (b) Second-order: PSD Hessian === -->
  <text x="375" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a9a7e">(b) Second-order</text>

  <!-- Axes -->
  <line x1="280" y1="240" x2="470" y2="240" stroke="#3d352f" stroke-width="0.8"/>
  <line x1="280" y1="240" x2="280" y2="75" stroke="#3d352f" stroke-width="0.8"/>

  <!-- Symmetric bowl (convex parabola) -->
  <path d="M 295,95 C 320,200 345,225 375,230 C 405,225 430,200 455,95" fill="none" stroke="#7a9a7e" stroke-width="2"/>

  <!-- Curvature annotation: upward-curving arc -->
  <path d="M 340,185 Q 375,205 410,185" fill="none" stroke="#b8995e" stroke-width="1.5"/>
  <polygon points="412,184 410,185 410,188" fill="#b8995e"/>
  <polygon points="338,184 340,185 340,188" fill="#b8995e"/>
  <text x="375" y="175" text-anchor="middle" font-size="10" fill="#b8995e">curves up</text>

  <!-- Minimum point -->
  <circle cx="375" cy="230" r="3.5" fill="#7a9a7e"/>

  <!-- Label -->
  <text x="375" y="265" text-anchor="middle" font-size="11" fill="#968a80">∇&#xb2;𝑓(𝑥) ⪰ 0</text>
  <text x="375" y="280" text-anchor="middle" font-size="10" fill="#968a80">Hessian is PSD</text>

  <!-- === (c) Epigraph is convex set === -->
  <text x="625" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#b56b6b">(c) Epigraph</text>

  <!-- Axes -->
  <line x1="530" y1="240" x2="720" y2="240" stroke="#3d352f" stroke-width="0.8"/>
  <line x1="530" y1="240" x2="530" y2="75" stroke="#3d352f" stroke-width="0.8"/>

  <!-- Symmetric convex curve -->
  <path d="M 545,95 C 570,200 595,225 625,230 C 655,225 680,200 705,95" fill="none" stroke="#b56b6b" stroke-width="2"/>

  <!-- Epigraph shading (above the curve) -->
  <path d="M 545,95 C 570,200 595,225 625,230 C 655,225 680,200 705,95 L 705,75 L 545,75 Z" fill="#b56b6b" fill-opacity="0.08"/>

  <!-- Label for epigraph -->
  <text x="640" y="100" font-size="11" fill="#b56b6b">epi 𝑓</text>

  <!-- Arrow pointing to shaded region -->
  <text x="625" y="265" text-anchor="middle" font-size="11" fill="#968a80">epi 𝑓 = {(𝑥,𝑡) : 𝑡 >= 𝑓(𝑥)}</text>
  <text x="625" y="280" text-anchor="middle" font-size="10" fill="#968a80">epigraph is a convex set</text>
</svg>
