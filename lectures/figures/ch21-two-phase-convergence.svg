<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#3d352f"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold">Two-Phase Convergence of Newton's Method</text>

  <!-- Axes -->
  <line x1="70" y1="290" x2="640" y2="290" stroke="#3d352f" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="70" y1="290" x2="70" y2="50" stroke="#3d352f" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="635" y="310" font-size="12" font-style="italic">iteration 𝑘</text>
  <text x="40" y="55" font-size="12">‖∇𝑓‖</text>

  <!-- Phase I: linear decrease (blue) -->
  <path d="M 90,80 L 180,110 L 260,140 L 340,170" fill="none" stroke="#7b97ad" stroke-width="2.2"/>

  <!-- Phase II: quadratic convergence (rose, steep drop) -->
  <path d="M 340,170 L 400,200 L 430,240 L 445,268 L 450,282 L 453,288" fill="none" stroke="#b56b6b" stroke-width="2.2"/>

  <!-- Phase divider -->
  <line x1="340" y1="55" x2="340" y2="285" stroke="#968a80" stroke-width="1" stroke-dasharray="5 3"/>

  <!-- Phase labels -->
  <text x="200" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#7b97ad">Phase I</text>
  <text x="200" y="88" text-anchor="middle" font-size="12" fill="#7b97ad">Linear decrease</text>

  <text x="480" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#b56b6b">Phase II</text>
  <text x="480" y="88" text-anchor="middle" font-size="12" fill="#b56b6b">Quadratic convergence</text>

  <!-- Epsilon threshold -->
  <line x1="70" y1="170" x2="640" y2="170" stroke="#b8995e" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="645" y="174" font-size="11" fill="#b8995e">‖∇𝑓‖ = 𝜂</text>

  <!-- Rate annotations -->
  <text x="180" y="155" text-anchor="middle" font-size="11" fill="#7b97ad">rate ~ 𝑂(𝜌&#x1D4F;)</text>
  <text x="440" y="160" text-anchor="middle" font-size="11" fill="#b56b6b">rate ~ 𝑂(𝑐</text>
  <text x="491" y="156" font-size="8" fill="#b56b6b">2&#x1D4F;</text>
  <text x="502" y="160" font-size="11" fill="#b56b6b">)</text>

  <!-- Convergence floor -->
  <line x1="70" y1="288" x2="640" y2="288" stroke="#7a9a7e" stroke-width="0.6" stroke-dasharray="2 2"/>
  <text x="645" y="292" font-size="10" fill="#7a9a7e">converged</text>
</svg>
