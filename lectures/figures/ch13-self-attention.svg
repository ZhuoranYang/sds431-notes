<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#968a80"/>
    </marker>
  </defs>

  <text x="300" y="24" text-anchor="middle" font-size="16" font-weight="bold">Self-Attention Mechanism</text>

  <!-- Input X -->
  <rect x="230" y="45" width="140" height="35" rx="6" fill="#7b97ad" fill-opacity="0.12" stroke="#7b97ad" stroke-width="1.5"/>
  <text x="300" y="67" text-anchor="middle" font-size="13" fill="#7b97ad" font-weight="bold">Input 𝑋 ∈ ℝ^{𝑛×𝑑}</text>

  <!-- Three projection arrows -->
  <line x1="260" y1="80" x2="120" y2="120" stroke="#968a80" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="300" y1="80" x2="300" y2="120" stroke="#968a80" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="340" y1="80" x2="480" y2="120" stroke="#968a80" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Q, K, V boxes -->
  <rect x="55" y="125" width="130" height="35" rx="6" fill="#b56b6b" fill-opacity="0.1" stroke="#b56b6b" stroke-width="1.5"/>
  <text x="120" y="147" text-anchor="middle" font-size="12" fill="#b56b6b" font-weight="bold">𝑄 = 𝑋𝑊_𝑄</text>

  <rect x="235" y="125" width="130" height="35" rx="6" fill="#7a9a7e" fill-opacity="0.1" stroke="#7a9a7e" stroke-width="1.5"/>
  <text x="300" y="147" text-anchor="middle" font-size="12" fill="#7a9a7e" font-weight="bold">𝐾 = 𝑋𝑊_𝐾</text>

  <rect x="415" y="125" width="130" height="35" rx="6" fill="#b8995e" fill-opacity="0.1" stroke="#b8995e" stroke-width="1.5"/>
  <text x="480" y="147" text-anchor="middle" font-size="12" fill="#b8995e" font-weight="bold">𝑉 = 𝑋𝑊_𝑉</text>

  <!-- QK^T computation -->
  <line x1="120" y1="160" x2="210" y2="200" stroke="#968a80" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="300" y1="160" x2="210" y2="200" stroke="#968a80" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="150" y="205" width="180" height="40" rx="6" fill="#907ea0" fill-opacity="0.1" stroke="#907ea0" stroke-width="1.5"/>
  <text x="240" y="222" text-anchor="middle" font-size="12" fill="#907ea0" font-weight="bold">𝑄𝐾&#x1D40; / √𝑑_𝑘</text>
  <text x="240" y="238" text-anchor="middle" font-size="10" fill="#907ea0">attention scores</text>

  <!-- Softmax -->
  <line x1="240" y1="245" x2="240" y2="275" stroke="#968a80" stroke-width="1" marker-end="url(#arr)"/>

  <rect x="170" y="280" width="140" height="35" rx="6" fill="#ad8480" fill-opacity="0.12" stroke="#ad8480" stroke-width="1.5"/>
  <text x="240" y="302" text-anchor="middle" font-size="12" fill="#ad8480" font-weight="bold">softmax(⋅)</text>

  <!-- Multiply by V -->
  <line x1="240" y1="315" x2="300" y2="345" stroke="#968a80" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="480" y1="160" x2="360" y2="345" stroke="#968a80" stroke-width="1" marker-end="url(#arr)" stroke-dasharray="4 2"/>

  <!-- Output -->
  <rect x="230" y="348" width="200" height="38" rx="6" fill="#7b97ad" fill-opacity="0.12" stroke="#7b97ad" stroke-width="2"/>
  <text x="330" y="367" text-anchor="middle" font-size="12" fill="#7b97ad" font-weight="bold">Output = softmax(𝑄𝐾&#x1D40;/√𝑑_𝑘) 𝑉</text>

  <!-- Weight matrix labels -->
  <text x="80" y="108" font-size="10" fill="#968a80" font-style="italic">𝑊_𝑄</text>
  <text x="290" y="108" font-size="10" fill="#968a80" font-style="italic">𝑊_𝐾</text>
  <text x="475" y="108" font-size="10" fill="#968a80" font-style="italic">𝑊_𝑉</text>
</svg>
