<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#968a80"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="20" y="50" width="190" height="100" rx="12" fill="#f9f6f0" stroke="#7b97ad" stroke-width="2"/>
  <text x="115" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#7b97ad">Step 1</text>
  <text x="115" y="102" text-anchor="middle" font-size="12">Equality constraints</text>
  <text x="115" y="120" text-anchor="middle" font-size="12">via modified Newton</text>

  <!-- Arrow 1-2 -->
  <line x1="215" y1="100" x2="255" y2="100" stroke="#968a80" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="260" y="50" width="190" height="100" rx="12" fill="#f9f6f0" stroke="#7a9a7e" stroke-width="2"/>
  <text x="355" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a9a7e">Step 2</text>
  <text x="355" y="102" text-anchor="middle" font-size="12">Log barrier for</text>
  <text x="355" y="120" text-anchor="middle" font-size="12">inequality constraints</text>

  <!-- Arrow 2-3 -->
  <line x1="455" y1="100" x2="495" y2="100" stroke="#968a80" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="500" y="50" width="190" height="100" rx="12" fill="#f9f6f0" stroke="#b56b6b" stroke-width="2"/>
  <text x="595" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#b56b6b">Step 3</text>
  <text x="595" y="102" text-anchor="middle" font-size="12">Barrier method</text>
  <text x="595" y="120" text-anchor="middle" font-size="12">(combine Steps 1 + 2)</text>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold">Three-Step Plan for Interior Point Methods</text>
</svg>
