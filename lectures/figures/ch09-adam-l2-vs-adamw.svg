<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#968a80"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold">Adam + L2 vs AdamW</text>

  <!-- Left: Adam + L2 -->
  <rect x="30" y="55" width="300" height="260" rx="14" fill="#f9f6f0" stroke="#7b97ad" stroke-width="1.8"/>
  <text x="180" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#7b97ad">Adam + L2 Regularization</text>

  <text x="180" y="115" text-anchor="middle" font-size="12">Loss: 𝑓(𝑥) + (𝜆/2)||𝑥||</text>
  <text x="270" y="111" font-size="9">2</text>

  <text x="180" y="150" text-anchor="middle" font-size="12">Gradient includes L2 term:</text>
  <text x="180" y="172" text-anchor="middle" font-size="12" fill="#7b97ad">𝑔 = ∇𝑓(𝑥) + 𝜆𝑥</text>

  <text x="180" y="210" text-anchor="middle" font-size="12">Adaptive scaling distorts</text>
  <text x="180" y="230" text-anchor="middle" font-size="12">the regularization:</text>
  <text x="180" y="258" text-anchor="middle" font-size="12" fill="#b56b6b">decay is non-uniform</text>
  <text x="180" y="278" text-anchor="middle" font-size="12" fill="#b56b6b">across parameters</text>

  <!-- Right: AdamW -->
  <rect x="370" y="55" width="300" height="260" rx="14" fill="#f9f6f0" stroke="#7a9a7e" stroke-width="1.8"/>
  <text x="520" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a9a7e">AdamW (Decoupled)</text>

  <text x="520" y="115" text-anchor="middle" font-size="12">Loss: 𝑓(𝑥) only</text>

  <text x="520" y="150" text-anchor="middle" font-size="12">Gradient is clean:</text>
  <text x="520" y="172" text-anchor="middle" font-size="12" fill="#7a9a7e">𝑔 = ∇𝑓(𝑥)</text>

  <text x="520" y="210" text-anchor="middle" font-size="12">Weight decay applied</text>
  <text x="520" y="230" text-anchor="middle" font-size="12">separately after update:</text>
  <text x="520" y="258" text-anchor="middle" font-size="12" fill="#7a9a7e">𝑥 <-- (1 - 𝜂𝜆)𝑥 - 𝜂 . update</text>
  <text x="520" y="278" text-anchor="middle" font-size="12" fill="#7a9a7e">uniform across params</text>

  <!-- vs divider -->
  <text x="350" y="195" text-anchor="middle" font-size="18" font-weight="bold" fill="#968a80">vs</text>
</svg>
