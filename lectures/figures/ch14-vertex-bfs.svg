<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#968a80"/>
    </marker>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold">Vertex -- BFS Correspondence</text>

  <!-- === Left: Geometric view (polytope) === -->
  <text x="160" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#7b97ad">Geometric View</text>

  <!-- Polytope -->
  <polygon points="60,270 50,140 140,80 250,90 280,200 220,280" fill="#7a9a7e" fill-opacity="0.08" stroke="#7a9a7e" stroke-width="1.8"/>

  <!-- Vertices -->
  <circle cx="60" cy="270" r="5" fill="#7b97ad"/>
  <text x="40" y="280" font-size="11" fill="#7b97ad">𝑣₁</text>

  <circle cx="50" cy="140" r="5" fill="#7b97ad"/>
  <text x="30" y="145" font-size="11" fill="#7b97ad">𝑣₂</text>

  <circle cx="140" cy="80" r="5" fill="#b56b6b"/>
  <text x="140" y="68" text-anchor="middle" font-size="11" fill="#b56b6b">𝑣₃</text>

  <circle cx="250" cy="90" r="5" fill="#7b97ad"/>
  <text x="265" y="85" font-size="11" fill="#7b97ad">𝑣₄</text>

  <circle cx="280" cy="200" r="5" fill="#7b97ad"/>
  <text x="293" y="200" font-size="11" fill="#7b97ad">𝑣₅</text>

  <circle cx="220" cy="280" r="5" fill="#7b97ad"/>
  <text x="230" y="295" font-size="11" fill="#7b97ad">𝑣₆</text>

  <!-- Label -->
  <text x="160" y="310" text-anchor="middle" font-size="11" fill="#968a80">vertices of polytope</text>

  <!-- === Right: Algebraic view (BFS table) === -->
  <text x="530" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8995e">Algebraic View</text>

  <!-- BFS table headers -->
  <text x="420" y="90" font-size="11" fill="#968a80" font-weight="bold">Vertex</text>
  <text x="500" y="90" font-size="11" fill="#968a80" font-weight="bold">Basic vars</text>
  <text x="610" y="90" font-size="11" fill="#968a80" font-weight="bold">Nonbasic</text>
  <line x1="410" y1="96" x2="670" y2="96" stroke="#968a80" stroke-width="0.8"/>

  <!-- Rows -->
  <text x="432" y="115" font-size="11" fill="#7b97ad" text-anchor="middle">𝑣₁</text>
  <text x="520" y="115" font-size="10" fill="#3d352f" text-anchor="middle">{𝑥₁, 𝑥₃, 𝑥₄}</text>
  <text x="625" y="115" font-size="10" fill="#968a80" text-anchor="middle">{𝑥₂, 𝑥₅} = 0</text>

  <text x="432" y="140" font-size="11" fill="#7b97ad" text-anchor="middle">𝑣₂</text>
  <text x="520" y="140" font-size="10" fill="#3d352f" text-anchor="middle">{𝑥₁, 𝑥₂, 𝑥₄}</text>
  <text x="625" y="140" font-size="10" fill="#968a80" text-anchor="middle">{𝑥₃, 𝑥₅} = 0</text>

  <rect x="410" y="148" width="260" height="22" rx="3" fill="#b56b6b" fill-opacity="0.08" stroke="none"/>
  <text x="432" y="165" font-size="11" fill="#b56b6b" text-anchor="middle" font-weight="bold">𝑣₃</text>
  <text x="520" y="165" font-size="10" fill="#b56b6b" text-anchor="middle">{𝑥₂, 𝑥₃, 𝑥₅}</text>
  <text x="625" y="165" font-size="10" fill="#b56b6b" text-anchor="middle">{𝑥₁, 𝑥₄} = 0</text>

  <text x="432" y="190" font-size="11" fill="#7b97ad" text-anchor="middle">𝑣₄</text>
  <text x="520" y="190" font-size="10" fill="#3d352f" text-anchor="middle">{𝑥₂, 𝑥₄, 𝑥₅}</text>
  <text x="625" y="190" font-size="10" fill="#968a80" text-anchor="middle">{𝑥₁, 𝑥₃} = 0</text>

  <text x="432" y="215" font-size="11" fill="#7b97ad" text-anchor="middle">𝑣₅</text>
  <text x="520" y="215" font-size="10" fill="#3d352f" text-anchor="middle">{𝑥₃, 𝑥₄, 𝑥₅}</text>
  <text x="625" y="215" font-size="10" fill="#968a80" text-anchor="middle">{𝑥₁, 𝑥₂} = 0</text>

  <text x="432" y="240" font-size="11" fill="#7b97ad" text-anchor="middle">𝑣₆</text>
  <text x="520" y="240" font-size="10" fill="#3d352f" text-anchor="middle">{𝑥₁, 𝑥₃, 𝑥₅}</text>
  <text x="625" y="240" font-size="10" fill="#968a80" text-anchor="middle">{𝑥₂, 𝑥₄} = 0</text>

  <text x="530" y="310" text-anchor="middle" font-size="11" fill="#968a80">basic feasible solutions</text>

  <!-- Connecting arrows -->
  <line x1="290" y1="270" x2="410" y2="115" stroke="#968a80" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="290" y1="140" x2="410" y2="140" stroke="#968a80" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="260" y1="90" x2="410" y2="160" stroke="#b56b6b" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="290" y1="90" x2="410" y2="190" stroke="#968a80" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="290" y1="200" x2="410" y2="215" stroke="#968a80" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="290" y1="280" x2="410" y2="240" stroke="#968a80" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arr)"/>
</svg>
