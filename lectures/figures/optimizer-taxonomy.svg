<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="bold">Taxonomy of First-Order Methods</text>

  <!-- Root -->
  <rect x="260" y="48" width="200" height="36" rx="8" fill="#f9f6f0" stroke="#3d352f" stroke-width="1.5"/>
  <text x="360" y="71" text-anchor="middle" font-size="13" font-weight="bold">First-Order Methods</text>

  <!-- Branch lines from root -->
  <line x1="310" y1="84" x2="150" y2="120" stroke="#968a80" stroke-width="1.2"/>
  <line x1="360" y1="84" x2="360" y2="120" stroke="#968a80" stroke-width="1.2"/>
  <line x1="410" y1="84" x2="570" y2="120" stroke="#968a80" stroke-width="1.2"/>

  <!-- === Left branch: Deterministic === -->
  <rect x="70" y="120" width="160" height="32" rx="6" fill="#7b97ad" fill-opacity="0.12" stroke="#7b97ad" stroke-width="1.5"/>
  <text x="150" y="141" text-anchor="middle" font-size="12" fill="#7b97ad" font-weight="bold">Deterministic</text>

  <!-- Left sub-branches -->
  <line x1="100" y1="152" x2="50" y2="185" stroke="#968a80" stroke-width="0.8"/>
  <line x1="150" y1="152" x2="150" y2="185" stroke="#968a80" stroke-width="0.8"/>
  <line x1="200" y1="152" x2="250" y2="185" stroke="#968a80" stroke-width="0.8"/>

  <rect x="5" y="185" width="90" height="28" rx="5" fill="#f9f6f0" stroke="#7b97ad" stroke-width="1"/>
  <text x="50" y="204" text-anchor="middle" font-size="10" fill="#7b97ad">Gradient Descent</text>

  <rect x="105" y="185" width="90" height="28" rx="5" fill="#f9f6f0" stroke="#7b97ad" stroke-width="1"/>
  <text x="150" y="204" text-anchor="middle" font-size="10" fill="#7b97ad">Nesterov AGD</text>

  <rect x="205" y="185" width="90" height="28" rx="5" fill="#f9f6f0" stroke="#7b97ad" stroke-width="1"/>
  <text x="250" y="204" text-anchor="middle" font-size="10" fill="#7b97ad">Prox. Gradient</text>

  <!-- === Middle branch: Stochastic === -->
  <rect x="280" y="120" width="160" height="32" rx="6" fill="#7a9a7e" fill-opacity="0.12" stroke="#7a9a7e" stroke-width="1.5"/>
  <text x="360" y="141" text-anchor="middle" font-size="12" fill="#7a9a7e" font-weight="bold">Stochastic</text>

  <!-- Middle sub-branches -->
  <line x1="320" y1="152" x2="300" y2="185" stroke="#968a80" stroke-width="0.8"/>
  <line x1="400" y1="152" x2="420" y2="185" stroke="#968a80" stroke-width="0.8"/>

  <rect x="240" y="185" width="120" height="28" rx="5" fill="#f9f6f0" stroke="#7a9a7e" stroke-width="1"/>
  <text x="300" y="204" text-anchor="middle" font-size="11" fill="#7a9a7e">SGD</text>

  <rect x="360" y="185" width="120" height="28" rx="5" fill="#f9f6f0" stroke="#7a9a7e" stroke-width="1"/>
  <text x="420" y="204" text-anchor="middle" font-size="11" fill="#7a9a7e">Mini-batch SGD</text>

  <!-- === Right branch: Adaptive === -->
  <rect x="490" y="120" width="160" height="32" rx="6" fill="#b8995e" fill-opacity="0.12" stroke="#b8995e" stroke-width="1.5"/>
  <text x="570" y="141" text-anchor="middle" font-size="12" fill="#b8995e" font-weight="bold">Adaptive</text>

  <!-- Right sub-branches -->
  <line x1="520" y1="152" x2="470" y2="185" stroke="#968a80" stroke-width="0.8"/>
  <line x1="570" y1="152" x2="570" y2="185" stroke="#968a80" stroke-width="0.8"/>
  <line x1="620" y1="152" x2="670" y2="185" stroke="#968a80" stroke-width="0.8"/>

  <rect x="425" y="185" width="90" height="28" rx="5" fill="#f9f6f0" stroke="#b8995e" stroke-width="1"/>
  <text x="470" y="204" text-anchor="middle" font-size="10" fill="#b8995e">AdaGrad</text>

  <rect x="525" y="185" width="90" height="28" rx="5" fill="#f9f6f0" stroke="#b8995e" stroke-width="1"/>
  <text x="570" y="204" text-anchor="middle" font-size="10" fill="#b8995e">RMSProp</text>

  <rect x="625" y="185" width="90" height="28" rx="5" fill="#f9f6f0" stroke="#b8995e" stroke-width="1"/>
  <text x="670" y="204" text-anchor="middle" font-size="10" fill="#b8995e">Adam/AdamW</text>

  <!-- === Bottom row: Key properties === -->
  <rect x="30" y="240" width="200" height="50" rx="6" fill="#7b97ad" fill-opacity="0.06" stroke="#7b97ad" stroke-width="0.8"/>
  <text x="130" y="260" text-anchor="middle" font-size="10" fill="#7b97ad">Uniform stepsize 𝜂</text>
  <text x="130" y="276" text-anchor="middle" font-size="10" fill="#7b97ad">𝑂(1/√𝑘) or 𝑂(𝜌&#x1D4F;) rate</text>

  <rect x="260" y="240" width="200" height="50" rx="6" fill="#7a9a7e" fill-opacity="0.06" stroke="#7a9a7e" stroke-width="0.8"/>
  <text x="360" y="260" text-anchor="middle" font-size="10" fill="#7a9a7e">Random gradient estimates</text>
  <text x="360" y="276" text-anchor="middle" font-size="10" fill="#7a9a7e">Trade accuracy for speed</text>

  <rect x="490" y="240" width="200" height="50" rx="6" fill="#b8995e" fill-opacity="0.06" stroke="#b8995e" stroke-width="0.8"/>
  <text x="590" y="260" text-anchor="middle" font-size="10" fill="#b8995e">Per-coordinate stepsizes</text>
  <text x="590" y="276" text-anchor="middle" font-size="10" fill="#b8995e">Scale with gradient history</text>

  <!-- Bottom connections -->
  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#968a80" font-style="italic">All methods use only ∇𝑓(𝑥) (first-order oracle)</text>
</svg>
