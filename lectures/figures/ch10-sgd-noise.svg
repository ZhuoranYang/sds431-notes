<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#3d352f"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="60" y1="290" x2="650" y2="290" stroke="#3d352f" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="60" y1="290" x2="60" y2="30" stroke="#3d352f" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="650" y="310" text-anchor="end" font-size="12" font-style="italic">iterations 𝑘</text>
  <text x="40" y="35" text-anchor="middle" font-size="12" font-style="italic">𝑓(𝑥)</text>

  <!-- Optimal value line -->
  <line x1="60" y1="250" x2="640" y2="250" stroke="#968a80" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="645" y="254" font-size="11" fill="#968a80" font-style="italic">𝑓*</text>

  <!-- Optimum marker -->
  <circle cx="600" cy="250" r="4" fill="#7a9a7e"/>
  <text x="600" y="270" text-anchor="middle" font-size="11" fill="#7a9a7e" font-style="italic">𝑥*</text>

  <!-- Full GD: smooth convergence (green) -->
  <path d="M 80,80 C 150,110 250,200 380,235 Q 480,248 600,250" fill="none" stroke="#7a9a7e" stroke-width="2.2"/>

  <!-- SGD b=1: noisy oscillating convergence (terracotta) -->
  <path d="M 80,70 L 110,130 L 130,85 L 155,150 L 175,100 L 200,165 L 225,120 L 250,180 L 275,145 L 300,190 L 330,160 L 360,205 L 390,175 L 420,215 L 450,195 L 480,225 L 510,205 L 540,230 L 570,215 L 600,240 L 630,225" fill="none" stroke="#b56b6b" stroke-width="1.5"/>

  <!-- Mini-batch SGD: moderate noise (blue) -->
  <path d="M 80,75 L 120,115 L 150,100 L 185,145 L 215,130 L 250,170 L 285,160 L 320,195 L 355,185 L 390,215 L 425,210 L 460,230 L 495,228 L 530,240 L 565,238 L 600,248" fill="none" stroke="#7b97ad" stroke-width="1.8" stroke-dasharray="6 3"/>

  <!-- Noise ball annotation -->
  <ellipse cx="600" cy="230" rx="35" ry="20" fill="none" stroke="#b56b6b" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6"/>
  <text x="605" y="210" font-size="10" fill="#b56b6b">noise ball</text>
  <text x="605" y="222" font-size="10" fill="#b56b6b">~ 𝜎</text>
  <text x="624" y="219" font-size="7" fill="#b56b6b">2</text>
  <text x="629" y="222" font-size="10" fill="#b56b6b">/𝑏</text>

  <!-- Legend -->
  <line x1="80" y1="325" x2="110" y2="325" stroke="#7a9a7e" stroke-width="2.2"/>
  <text x="118" y="329" font-size="11" fill="#7a9a7e">Full GD (smooth)</text>

  <line x1="270" y1="325" x2="300" y2="325" stroke="#7b97ad" stroke-width="1.8" stroke-dasharray="6 3"/>
  <text x="308" y="329" font-size="11" fill="#7b97ad">Mini-batch SGD</text>

  <line x1="460" y1="325" x2="490" y2="325" stroke="#b56b6b" stroke-width="1.5"/>
  <text x="498" y="329" font-size="11" fill="#b56b6b">SGD (𝑏 = 1)</text>
</svg>
