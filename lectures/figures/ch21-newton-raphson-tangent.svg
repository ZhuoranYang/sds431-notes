<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0,0 7,2.5 0,5" fill="#3d352f"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="bold">Newton--Raphson: Tangent Line to Root</text>

  <!-- Axes -->
  <line x1="50" y1="260" x2="560" y2="260" stroke="#3d352f" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="80" y1="320" x2="80" y2="40" stroke="#3d352f" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="555" y="278" font-size="12" font-style="italic">𝑥</text>
  <text x="65" y="48" font-size="12" font-style="italic">𝑓(𝑥)</text>

  <!-- Function curve (sage green) -->
  <path d="M 100,230 Q 180,310 260,220 Q 340,120 420,60 Q 470,30 530,45" fill="none" stroke="#7a9a7e" stroke-width="2.5"/>
  <text x="535" y="40" font-size="13" fill="#7a9a7e" font-style="italic">𝑓(𝑥)</text>

  <!-- Root (where f crosses x-axis) -->
  <circle cx="215" cy="260" r="5" fill="#7a9a7e"/>
  <text x="215" y="285" text-anchor="middle" font-size="12" fill="#7a9a7e" font-style="italic">𝑥*</text>

  <!-- x_k point on curve -->
  <circle cx="400" cy="80" r="4" fill="#b56b6b"/>
  <line x1="400" y1="80" x2="400" y2="260" stroke="#b56b6b" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="400" y="280" text-anchor="middle" font-size="12" fill="#b56b6b" font-style="italic">𝑥</text>
  <text x="410" y="284" font-size="8" fill="#b56b6b">𝑘</text>

  <!-- Tangent line from (x_k, f(x_k)) intersecting x-axis -->
  <line x1="260" y1="260" x2="500" y2="0" stroke="#7b97ad" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- x_{k+1} = tangent x-intercept -->
  <circle cx="300" cy="260" r="4" fill="#7b97ad"/>
  <line x1="300" y1="260" x2="300" y2="270" stroke="#7b97ad" stroke-width="1"/>
  <text x="300" y="285" text-anchor="middle" font-size="12" fill="#7b97ad" font-style="italic">𝑥</text>
  <text x="310" y="289" font-size="8" fill="#7b97ad">𝑘+1</text>

  <!-- Annotation: tangent line label -->
  <text x="470" y="25" font-size="11" fill="#7b97ad">tangent at 𝑥</text>
  <text x="534" y="29" font-size="8" fill="#7b97ad">𝑘</text>

  <!-- Formula -->
  <text x="300" y="330" text-anchor="middle" font-size="13" fill="#968a80">𝑥</text>
  <text x="308" y="334" font-size="9" fill="#968a80">𝑘+1</text>
  <text x="328" y="330" font-size="13" fill="#968a80"> = 𝑥</text>
  <text x="352" y="334" font-size="9" fill="#968a80">𝑘</text>
  <text x="360" y="330" font-size="13" fill="#968a80"> - 𝑓(𝑥</text>
  <text x="398" y="334" font-size="9" fill="#968a80">𝑘</text>
  <text x="404" y="330" font-size="13" fill="#968a80">) / 𝑓'(𝑥</text>
  <text x="457" y="334" font-size="9" fill="#968a80">𝑘</text>
  <text x="463" y="330" font-size="13" fill="#968a80">)</text>
</svg>
