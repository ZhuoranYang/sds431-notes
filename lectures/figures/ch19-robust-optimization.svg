<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <defs>
    <style>
      text { font-family: 'Palatino Linotype', Palatino, Georgia, serif; fill: #3d352f; }
    </style>
  </defs>

  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold">Nominal LP vs Robust LP</text>

  <!-- === Left: Nominal LP === -->
  <text x="175" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#7b97ad">Nominal LP</text>

  <!-- Nominal feasible polytope -->
  <polygon points="60,260 50,130 140,70 260,90 280,200 220,270" fill="#7b97ad" fill-opacity="0.1" stroke="#7b97ad" stroke-width="1.8"/>
  <text x="165" y="185" text-anchor="middle" font-size="11" fill="#7b97ad">nominal feasible</text>

  <!-- Nominal optimal -->
  <circle cx="140" cy="70" r="5" fill="#7b97ad"/>
  <text x="140" y="55" text-anchor="middle" font-size="11" fill="#7b97ad">𝑥*_nom</text>

  <!-- Constraint perturbation arrows -->
  <line x1="50" y1="130" x2="40" y2="140" stroke="#b56b6b" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="50" y1="130" x2="60" y2="120" stroke="#b56b6b" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="260" y1="90" x2="250" y2="100" stroke="#b56b6b" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="260" y1="90" x2="270" y2="80" stroke="#b56b6b" stroke-width="0.8" stroke-dasharray="2 2"/>

  <text x="175" y="290" text-anchor="middle" font-size="11" fill="#b56b6b">constraints may shift under perturbation</text>
  <text x="175" y="305" text-anchor="middle" font-size="11" fill="#b56b6b">𝑥*_nom may become infeasible!</text>

  <!-- Divider -->
  <line x1="350" y1="45" x2="350" y2="310" stroke="#968a80" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- === Right: Robust LP === -->
  <text x="525" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a9a7e">Robust LP</text>

  <!-- Nominal boundary (light) -->
  <polygon points="410,260 400,130 490,70 610,90 630,200 570,270" fill="none" stroke="#968a80" stroke-width="0.8" stroke-dasharray="4 3"/>

  <!-- Robust feasible region (shrunk inward) -->
  <polygon points="430,245 420,145 490,100 590,110 605,195 555,255" fill="#7a9a7e" fill-opacity="0.15" stroke="#7a9a7e" stroke-width="2"/>
  <text x="510" y="190" text-anchor="middle" font-size="11" fill="#7a9a7e">robust feasible</text>

  <!-- Robust optimal -->
  <circle cx="490" cy="100" r="5" fill="#7a9a7e"/>
  <text x="490" y="87" text-anchor="middle" font-size="11" fill="#7a9a7e">𝑥*_rob</text>

  <!-- Uncertainty sets (small ellipses near constraints) -->
  <ellipse cx="420" cy="145" rx="12" ry="8" fill="#b8995e" fill-opacity="0.15" stroke="#b8995e" stroke-width="0.8"/>
  <ellipse cx="590" cy="110" rx="12" ry="8" fill="#b8995e" fill-opacity="0.15" stroke="#b8995e" stroke-width="0.8"/>
  <ellipse cx="605" cy="195" rx="10" ry="8" fill="#b8995e" fill-opacity="0.15" stroke="#b8995e" stroke-width="0.8"/>
  <text x="620" y="135" font-size="10" fill="#b8995e">uncertainty</text>
  <text x="620" y="148" font-size="10" fill="#b8995e">sets 𝒰ᵢ</text>

  <text x="525" y="290" text-anchor="middle" font-size="11" fill="#7a9a7e">feasible for ALL realizations 𝑎ᵢ ∈ 𝒰ᵢ</text>
  <text x="525" y="305" text-anchor="middle" font-size="11" fill="#7a9a7e">smaller region, but immune to perturbations</text>
</svg>
